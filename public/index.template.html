  <div class="toast" id="toast"></div>

  <script>
    function escapeHtml(str) {
      if (str == null) return "";
      var d = document.createElement("div");
      d.textContent = String(str);
      return d.innerHTML;
    }

    function safeUrl(url) {
      try {
        var u = new URL(url);
        if (u.protocol === "http:" || u.protocol === "https:") return encodeURI(url);
      } catch(e) {}
      return "#";
    }

    // Build-time injection from NEXT_PUBLIC_MAPBOX_TOKEN via scripts/inject-env.js
    var TOKEN = "__MAPBOX_TOKEN__";
    var TYPE_COLORS = { Attack: "#ef4444", Warning: "#f59e0b", Sighting: "#10b981", Flood: "#0ea5e9", Unknown: "#3b82f6" };

    var allSightings = [];
    var allFloodReports = [];
    var floodSourceStatus = { nws: { available: false, count: 0 }, gdacs: { available: false, count: 0 } };
    var floodUpdatedAt = null;
    var floodLoading = false;
    var floodLoadFailed = false;
    var currentFilter = "All";
    var currentSpecies = "All";
    var currentTimeRange = "30d";
    var selectedId = null;
    var activePopup = null;
    var mapLoaded = false;
    var sightingsRequest = null;
    var sightingsLocationQuery = null;
    var sightingsLoadFailed = false;

    // ── Shark 3D images by species ──────────────
    var SHARK_IMAGES = {
      "All": "/shark-mascot.png",
      "Great White": "/shark-great-white.png",
      "Tiger": "/shark-tiger.png",
      "Hammerhead": "/shark-hammerhead.png",
      "Bull": "/shark-bull.png",
      "Mako": "/shark-mako.png",
      "Whale Shark": "/shark-whale.png",
      "Blacktip": "/shark-blacktip.png",
      "Blue": "/shark-blue.png",
      "Nurse": "/shark-nurse.png",
      "Reef": "/shark-reef.png"
    };

    var SHARK_SVG_FALLBACK = '<svg viewBox="0 0 64 36"><path d="M4,20 C8,14 16,12 22,14 L26,6 L30,14 C38,10 52,14 58,18 L60,14 L58,20 L62,22 C48,28 24,26 14,23 C9,22 5,22 4,20Z" fill="currentColor"/><circle cx="18" cy="16" r="1.5" fill="#020617"/></svg>';

    function getSharkIcon(species) {
      var img = SHARK_IMAGES[species];
      if (img) return '<img src="' + img + '" alt="' + escapeHtml(species) + '">';
      return SHARK_SVG_FALLBACK;
    }

    // Species without a dedicated icon roll up under "Other"
    function bucketSpecies(species) {
      if (!species || species === "Unknown") return "Unknown";
      if (SHARK_IMAGES[species]) return species;
      return "Other";
    }

    function findSightingById(id) {
      var sid = String(id);
      return allSightings.find(function(s) { return String(s.id) === sid; });
    }

    // ── Map ──────────────────────────────────────
    var mapStatus = document.getElementById("map-status");
    var map = null;
    if (TOKEN.indexOf("pk.") === 0 && typeof mapboxgl !== "undefined") {
      try {
        mapboxgl.accessToken = TOKEN;
        map = new mapboxgl.Map({
          container: "map",
          style: "mapbox://styles/mapbox/satellite-streets-v12",
          center: [-128, 37],
          zoom: 3.5,
          projection: "globe"
        });
        map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), "top-left");
      } catch (error) {
        if (map) map.remove();
        map = null;
      }
    }
    mapStatus.hidden = !!map;

    function resizeMap() {
      if (map) map.resize();
    }

    // Logo click resets map view (keyboard-accessible button)
    var logoBtn = document.getElementById("logo-btn");
    if (logoBtn) {
      logoBtn.addEventListener("click", function() {
        if (mapLoaded) map.flyTo({ center: [-128, 37], zoom: 3.5, duration: 1500 });
      });
    }

    if (map) map.on("error", function() {
      if (!mapLoaded) mapStatus.hidden = false;
    });

    if (map) map.on("load", function() {
      mapLoaded = true;
      mapStatus.hidden = true;

      map.setFog({
        color: "rgb(10, 20, 40)",
        "high-color": "rgb(20, 40, 80)",
        "horizon-blend": 0.08,
        "space-color": "rgb(2, 6, 23)",
        "star-intensity": 0.4
      });

      map.addSource("sightings", {
        type: "geojson",
        data: { type: "FeatureCollection", features: [] }
      });

      map.addSource("flood-reports", {
        type: "geojson",
        data: { type: "FeatureCollection", features: [] }
      });

      map.addLayer({
        id: "sightings-glow",
        type: "circle",
        source: "sightings",
        paint: {
          "circle-radius": ["interpolate", ["linear"], ["zoom"], 1, 8, 6, 16, 12, 26],
          "circle-color": ["match", ["get", "type"], "Attack", "#ef4444", "Warning", "#f59e0b", "Sighting", "#10b981", "#3b82f6"],
          "circle-opacity": 0.2,
          "circle-blur": 1
        }
      });

      map.addLayer({
        id: "sightings-dots",
        type: "circle",
        source: "sightings",
        paint: {
          "circle-radius": ["interpolate", ["linear"], ["zoom"], 1, 5, 6, 8, 12, 14],
          "circle-color": ["match", ["get", "type"], "Attack", "#ef4444", "Warning", "#f59e0b", "Sighting", "#10b981", "#3b82f6"],
          "circle-stroke-width": 2.5,
          "circle-stroke-color": "#ffffff"
        }
      });

      map.addLayer({
        id: "flood-area-fill",
        type: "fill",
        source: "flood-reports",
        filter: ["any", ["==", ["geometry-type"], "Polygon"], ["==", ["geometry-type"], "MultiPolygon"]],
        paint: {
          "fill-color": ["match", ["get", "severity"], "Extreme", "#b91c1c", "Severe", "#dc2626", "Moderate", "#f97316", "Minor", "#0ea5e9", "Red", "#dc2626", "Orange", "#f97316", "#38bdf8"],
          "fill-opacity": 0.16
        }
      });

      map.addLayer({
        id: "flood-area-outline",
        type: "line",
        source: "flood-reports",
        filter: ["any", ["==", ["geometry-type"], "Polygon"], ["==", ["geometry-type"], "MultiPolygon"]],
        paint: {
          "line-color": ["match", ["get", "severity"], "Extreme", "#b91c1c", "Severe", "#dc2626", "Moderate", "#f97316", "Minor", "#0ea5e9", "Red", "#dc2626", "Orange", "#f97316", "#38bdf8"],
          "line-width": 2,
          "line-opacity": 0.9
        }
      });

      map.addLayer({
        id: "flood-points",
        type: "circle",
        source: "flood-reports",
        filter: ["==", ["geometry-type"], "Point"],
        paint: {
          "circle-radius": ["interpolate", ["linear"], ["zoom"], 1, 6, 6, 10, 12, 15],
          "circle-color": ["match", ["get", "severity"], "Extreme", "#b91c1c", "Severe", "#dc2626", "Moderate", "#f97316", "Minor", "#0ea5e9", "Red", "#dc2626", "Orange", "#f97316", "#38bdf8"],
          "circle-stroke-width": 2.5,
          "circle-stroke-color": "#ffffff"
        }
      });

      function openMapPopupFromFeature(f) {
        if (!f || !f.geometry || f.geometry.type !== "Point") return;
        var props = f.properties || {};
        var coords = f.geometry.coordinates;
        var title = (props.title != null ? String(props.title) : "").substring(0, 80);
        var species = props.species != null ? String(props.species) : "";
        var location = props.location != null ? String(props.location) : "";
        var typ = props.type != null ? String(props.type) : "";
        var source = props.source != null ? String(props.source) : "";
        var url = props.url != null ? String(props.url) : "";
        if (activePopup) { activePopup.remove(); activePopup = null; }
        selectedId = props.id;
        updateFeed();
        var speciesHtml = species && species !== "Unknown"
          ? '<span style="display:inline-flex;align-items:center;gap:3px;font-size:10px;color:#0d9488;background:rgba(13,148,136,0.1);padding:2px 7px;border-radius:99px;margin:4px 0;">' + escapeHtml(species) + '</span>'
          : '';
        activePopup = new mapboxgl.Popup({ offset: 12, closeButton: true, maxWidth: "280px" })
          .setLngLat(coords)
          .setHTML('<div style="font-family:system-ui;padding:4px 0;"><p style="margin:0 0 4px;font-weight:600;font-size:13px;color:#1a1a2e;">' + escapeHtml(title) + '</p>' + speciesHtml + '<p style="margin:4px 0 8px;font-size:11px;color:#555;">' + escapeHtml(location) + ' &middot; ' + escapeHtml(typ) + ' &middot; ' + escapeHtml(source) + '<br>Location may be approximate.</p><a href="' + safeUrl(url) + '" target="_blank" rel="noopener" style="font-size:12px;color:#0d9488;font-weight:600;text-decoration:none;">Read article →</a></div>')
          .addTo(map);
      }

      function openFloodPopupFromFeature(f, clickLocation) {
        if (!f || !f.properties) return;
        var props = f.properties;
        var coords = f.geometry && f.geometry.type === "Point"
          ? f.geometry.coordinates
          : [clickLocation.lng, clickLocation.lat];
        var title = String(props.title || "Flood report").substring(0, 140);
        var location = String(props.location || "Location unavailable");
        var severity = String(props.severity || "Current");
        var source = String(props.source || "Flood source");
        var description = String(props.description || "").substring(0, 420);
        var url = props.url != null ? String(props.url) : "";
        if (activePopup) { activePopup.remove(); activePopup = null; }
        selectedId = props.id;
        updateFeed();
        activePopup = new mapboxgl.Popup({ offset: 12, closeButton: true, maxWidth: "300px" })
          .setLngLat(coords)
          .setHTML('<div style="font-family:system-ui;padding:4px 0;"><p style="margin:0 0 5px;font-weight:700;font-size:13px;color:#1a1a2e;">' + escapeHtml(title) + '</p><p style="margin:0 0 5px;font-size:11px;color:#555;">' + escapeHtml(location) + ' · ' + escapeHtml(severity) + ' · ' + escapeHtml(source) + '</p>' + (description ? '<p style="margin:5px 0 7px;font-size:11px;color:#555;max-height:90px;overflow:auto;">' + escapeHtml(description) + '</p>' : '') + (url ? '<a href="' + safeUrl(url) + '" target="_blank" rel="noopener" style="font-size:12px;color:#0369a1;font-weight:600;text-decoration:none;">Open source report</a>' : '') + '</div>')
          .addTo(map);
      }

      map.on("click", function(e) {
        var features = map.queryRenderedFeatures(e.point, { layers: ["flood-points", "flood-area-outline", "flood-area-fill", "sightings-dots", "sightings-glow"] });
        if (!features.length) return;
        var floodFeature = features.find(function(feature) { return feature.properties && feature.properties.type === "Flood"; });
        if (floodFeature) {
          openFloodPopupFromFeature(floodFeature, e.lngLat);
          window.dispatchEvent(new Event("sharkmap:select"));
          return;
        }
        var top = features[0];
        openMapPopupFromFeature(top);
        window.dispatchEvent(new Event("sharkmap:select"));
      });

      map.on("mouseenter", "sightings-dots", function() { map.getCanvas().style.cursor = "pointer"; });
      map.on("mouseleave", "sightings-dots", function() { map.getCanvas().style.cursor = ""; });
      map.on("mouseenter", "sightings-glow", function() { map.getCanvas().style.cursor = "pointer"; });
      map.on("mouseleave", "sightings-glow", function() { map.getCanvas().style.cursor = ""; });
      map.on("mouseenter", "flood-points", function() { map.getCanvas().style.cursor = "pointer"; });
      map.on("mouseleave", "flood-points", function() { map.getCanvas().style.cursor = ""; });
      map.on("mouseenter", "flood-area-fill", function() { map.getCanvas().style.cursor = "pointer"; });
      map.on("mouseleave", "flood-area-fill", function() { map.getCanvas().style.cursor = ""; });

      render();

      applyAutoCoastalFocus();
    });

    // ── Auto coastal focus (IP-derived, Vercel-side; only on first load, no user filter) ──
    var COASTAL_FOCUS_POINTS = [
      { name: "Santa Monica", lat: 34.0195, lon: -118.4912, zoom: 6 },
      { name: "Huntington Beach", lat: 33.6595, lon: -117.9988, zoom: 7 },
      { name: "San Diego", lat: 32.7157, lon: -117.1611, zoom: 7 },
      { name: "San Francisco Ocean Beach", lat: 37.7594, lon: -122.5107, zoom: 7 },
      { name: "New Smyrna Beach", lat: 29.0258, lon: -80.9262, zoom: 7 },
      { name: "Miami Beach", lat: 25.7907, lon: -80.1300, zoom: 7 },
      { name: "Cape Cod", lat: 41.6688, lon: -70.2962, zoom: 7 },
      { name: "Outer Banks", lat: 35.5585, lon: -75.4665, zoom: 7 },
      { name: "Galveston", lat: 29.3013, lon: -94.7977, zoom: 7 },
      { name: "Honolulu", lat: 21.2760, lon: -157.8267, zoom: 8 },
      { name: "Bondi Beach", lat: -33.8915, lon: 151.2767, zoom: 8 },
      { name: "Cape Town", lat: -34.0572, lon: 18.3336, zoom: 7 },
      { name: "Hossegor", lat: 43.6655, lon: -1.4428, zoom: 7 },
      { name: "Raglan", lat: -37.8112, lon: 174.8155, zoom: 7 }
    ];
    function milesBetween(aLat, aLon, bLat, bLon) {
      var R = 3958.8;
      var toRad = function(x) { return x * Math.PI / 180; };
      var dLat = toRad(bLat - aLat), dLon = toRad(bLon - aLon);
      var lat1 = toRad(aLat), lat2 = toRad(bLat);
      var x = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
    }
    function nearestCoastalAnchor(lat, lon) {
      var best = null, bestDist = Infinity;
      for (var i = 0; i < COASTAL_FOCUS_POINTS.length; i++) {
        var p = COASTAL_FOCUS_POINTS[i];
        var d = milesBetween(lat, lon, p.lat, p.lon);
        if (d < bestDist) { bestDist = d; best = p; }
      }
      return best;
    }
    var AUTO_FOCUS_KEY = "sharkbait:autoFocus";
    function isAutoFocusEnabled() {
      try { return localStorage.getItem(AUTO_FOCUS_KEY) !== "off"; }
      catch (e) { return true; }
    }
    function setAutoFocusEnabled(on) {
      try { localStorage.setItem(AUTO_FOCUS_KEY, on ? "on" : "off"); } catch (e) {}
      var btn = document.getElementById("auto-focus-toggle");
      if (btn) {
        btn.textContent = "📍 Auto-focus: " + (on ? "on" : "off");
        btn.setAttribute("aria-pressed", on ? "true" : "false");
      }
    }
    document.addEventListener("DOMContentLoaded", function() {
      setAutoFocusEnabled(isAutoFocusEnabled());
      var btn = document.getElementById("auto-focus-toggle");
      if (btn) btn.addEventListener("click", function() { setAutoFocusEnabled(!isAutoFocusEnabled()); });
    });

    function applyAutoCoastalFocus() {
      if (activeLocation) return;
      if (!isAutoFocusEnabled()) return;
      fetch("/api/geo")
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(geo) {
          if (!geo || !geo.available || activeLocation || !isAutoFocusEnabled()) return;
          var anchor = nearestCoastalAnchor(geo.lat, geo.lon);
          if (!anchor) return;
          try { map.flyTo({ center: [anchor.lon, anchor.lat], zoom: anchor.zoom || 7, duration: 1800 }); }
          catch (e) { /* map not ready */ }
        })
        .catch(function() { /* silent — fall back to default global view */ });
    }

    // ── Helpers ──────────────────────────────────
    function timeAgo(dateStr) {
      var ts = new Date(dateStr).getTime();
      if (isNaN(ts)) return "recently";
      var diff = Date.now() - ts;
      var mins = Math.floor(diff / 60000);
      if (mins < 0) return "just now";
      if (mins < 60) return mins + "m ago";
      var hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + "h ago";
      return Math.floor(hrs / 24) + "d ago";
    }

    function getTimeRangeCutoff() {
      var now = Date.now();
      if (currentTimeRange === "today") return now - 24 * 60 * 60 * 1000;
      if (currentTimeRange === "7d") return now - 7 * 24 * 60 * 60 * 1000;
      if (currentTimeRange === "30d") return now - 30 * 24 * 60 * 60 * 1000;
      return 0;
    }

    function getFiltered() {
      var cutoff = getTimeRangeCutoff();
      if (currentFilter === "Flood") {
        return allFloodReports;
      }
      var s = allSightings;
      if (cutoff > 0) {
        s = s.filter(function(x) { return new Date(x.date).getTime() >= cutoff; });
      }
      if (currentFilter !== "All") {
        s = s.filter(function(x) { return x.type === currentFilter; });
      }
      if (currentSpecies !== "All") {
        s = s.filter(function(x) { return bucketSpecies(x.species) === currentSpecies; });
      }
      return s;
    }

    // ── Animated stat counter ────────────────────
    function animateCount(el, target) {
      var current = parseInt(el.textContent) || 0;
      if (current === target) return;
      var duration = 600;
      var start = performance.now();
      function step(ts) {
        var progress = Math.min((ts - start) / duration, 1);
        var eased = 1 - Math.pow(1 - progress, 3);
        el.textContent = Math.round(current + (target - current) * eased);
        if (progress < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    function updateStats() {
      var f = getFiltered();
      var counts = { Attack: 0, Warning: 0, Sighting: 0 };
      for (var i = 0; i < f.length; i++) {
        if (counts[f[i].type] !== undefined) counts[f[i].type]++;
      }
      animateCount(document.getElementById("stat-total"), f.length);
      animateCount(document.getElementById("stat-attack"), counts.Attack);
      animateCount(document.getElementById("stat-warning"), counts.Warning);
      animateCount(document.getElementById("stat-sighting"), counts.Sighting);
    }

    // ── Species Bar ─────────────────────────────
    function updateSpeciesBar() {
      var bar = document.getElementById("species-bar");
      if (currentFilter === "Flood") {
        bar.innerHTML = "";
        return;
      }
      var counts = {};
      var cutoff = getTimeRangeCutoff();
      var base = allSightings;
      if (cutoff > 0) {
        base = base.filter(function(x) { return new Date(x.date).getTime() >= cutoff; });
      }
      var filtered = currentFilter === "All"
        ? base
        : base.filter(function(s) { return s.type === currentFilter; });

      filtered.forEach(function(s) {
        var sp = bucketSpecies(s.species);
        counts[sp] = (counts[sp] || 0) + 1;
      });

      // Sort by count, but pin "Other" and "Unknown" to the end
      var speciesList = Object.keys(counts).sort(function(a, b) {
        var aLast = (a === "Other" || a === "Unknown") ? 1 : 0;
        var bLast = (b === "Other" || b === "Unknown") ? 1 : 0;
        if (aLast !== bLast) return aLast - bLast;
        return counts[b] - counts[a];
      });

      var html = '<div class="species-item' + (currentSpecies === "All" ? " active" : "") + '" data-species="All">';
      html += '<div class="species-icon">' + getSharkIcon("All") + '</div>';
      html += '<div class="species-label">All</div>';
      html += '<div class="species-count">' + filtered.length + '</div>';
      html += '</div>';

      for (var i = 0; i < speciesList.length; i++) {
        var sp = speciesList[i];
        html += '<div class="species-item' + (currentSpecies === sp ? " active" : "") + '" data-species="' + escapeHtml(sp) + '">';
        html += '<div class="species-icon">' + getSharkIcon(sp) + '</div>';
        html += '<div class="species-label">' + escapeHtml(sp) + '</div>';
        html += '<div class="species-count">' + counts[sp] + '</div>';
        html += '</div>';
      }

      bar.innerHTML = html;

      bar.querySelectorAll(".species-item").forEach(function(item) {
        item.addEventListener("click", function() {
          currentSpecies = this.getAttribute("data-species");
          render();
        });
      });
    }

    // ── Map Data ────────────────────────────────
    function updateMapData() {
      if (!mapLoaded) return;
      var floodView = currentFilter === "Flood";
      var sightings = floodView ? [] : getFiltered();
      var features = sightings.map(function(s) {
        return {
          type: "Feature",
          geometry: { type: "Point", coordinates: [s.lon, s.lat] },
          properties: {
            id: s.id,
            title: s.title,
            location: s.location,
            type: s.type,
            species: s.species || "Unknown",
            source: s.source,
            url: s.url || ""
          }
        };
      });
      var src = map.getSource("sightings");
      if (src) src.setData({ type: "FeatureCollection", features: features });

      var floods = floodView ? getFiltered() : [];
      var floodFeatures = floods.filter(function(report) {
        return report.geometry || (Number.isFinite(report.lat) && Number.isFinite(report.lon));
      }).map(function(report) {
        var geometry = report.geometry || { type: "Point", coordinates: [report.lon, report.lat] };
        return {
          type: "Feature",
          geometry: geometry,
          properties: {
            id: report.id,
            title: report.title,
            location: report.location,
            type: "Flood",
            severity: report.severity,
            source: report.source,
            url: report.url || "",
            description: report.description || ""
          }
        };
      });
      var floodSource = map.getSource("flood-reports");
      if (floodSource) floodSource.setData({ type: "FeatureCollection", features: floodFeatures });
      ["sightings-glow", "sightings-dots"].forEach(function(id) {
        if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", floodView ? "none" : "visible");
      });
      ["flood-area-fill", "flood-area-outline", "flood-points"].forEach(function(id) {
        if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", floodView ? "visible" : "none");
      });
    }

    // ── Feed ─────────────────────────────────────
    function updateFeed() {
      var feed = document.getElementById("feed");
      var sightings = getFiltered();
      var floodView = currentFilter === "Flood";
      var html = "";
      if (floodView) {
        if (floodLoading && sightings.length === 0) {
          feed.innerHTML = '<div class="empty">Loading flood reports…</div>';
          return;
        }
        var nws = floodSourceStatus.nws;
        var gdacs = floodSourceStatus.gdacs;
        var nwsText = nws.available ? "U.S. NWS " + nws.count : "U.S. NWS unavailable";
        var gdacsText = gdacs.available ? "Global GDACS " + gdacs.count : "Global GDACS unavailable";
        var updated = floodUpdatedAt ? " Updated " + timeAgo(floodUpdatedAt) + "." : "";
        var stale = floodLoadFailed && sightings.length ? " Refresh failed. Showing previously loaded reports." : "";
        html = '<div class="flood-note">' + escapeHtml(nwsText + " · " + gdacsText + ". NWS alerts are active. GDACS covers events from the last 30 days." + updated + stale) + " Shaded areas show available alert coverage. Some alerts appear only in the list. Pins show approximate locations.</div>";
        if (sightings.length === 0) {
          var floodUnavailable = floodLoadFailed || (!nws.available && !gdacs.available);
          var floodEmpty = floodUnavailable ? "Flood reports are unavailable right now. Tap refresh to try again." : "No flood reports available right now.";
          feed.innerHTML = html + '<div class="empty">' + floodEmpty + '</div>';
          return;
        }
      }
      if (sightings.length === 0) {
        var emptyMsg;
        if (sightingsLoadFailed) {
          emptyMsg = "Sightings are unavailable. Tap refresh to try again.";
        } else if (sightingsRequest) {
          emptyMsg = "Loading sightings…";
        } else if (activeLocation) {
          emptyMsg = "No shark activity within " + activeLocation.radiusMiles + " mi of " + escapeHtml(activeLocation.name);
        } else {
          var rangeLabels = { all: " in the past year", today: " in the past 24 hours", "7d": " in the past 7 days", "30d": " in the past 30 days" };
          emptyMsg = "No sightings found" + (rangeLabels[currentTimeRange] || "");
        }
        feed.innerHTML = '<div class="empty">' + emptyMsg + '</div>';
        return;
      }
      if (!floodView) {
        html = '<div class="flood-note">Locations may be approximate. News dates show when an article was published; check the source for when the sighting happened.</div>';
      }
      for (var i = 0; i < sightings.length; i++) {
        var s = sightings[i];
        var badgeClass = "badge-" + (floodView ? "flood" : s.type.toLowerCase());
        var activeClass = String(s.id) === String(selectedId) ? " active" : "";
        var accent = TYPE_COLORS[floodView ? "Flood" : s.type] || "#3b82f6";
        var delay = Math.min(i * 0.04, 0.8);

        html += '<div class="card' + activeClass + '" data-id="' + escapeHtml(s.id) + '" style="--card-accent:' + accent + ';animation-delay:' + delay + 's">';
        html += '<div class="card-header"><div class="card-title">' + escapeHtml(s.title) + '</div>';
        html += '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0;">';
        html += '<span class="badge ' + badgeClass + '">' + (floodView ? "Flood" : escapeHtml(s.type)) + '</span>';
        html += floodView ? '<span class="badge badge-flood">' + escapeHtml(s.severity || "Current") + '</span>' : healthBadge(s.confidence, s.healthScore);
        html += '</div></div>';

        if (s.species && s.species !== "Unknown") {
          html += '<div class="card-species">' + getSharkIcon(s.species) + ' ' + escapeHtml(s.species) + '</div>';
        }

        if (floodView) html += '<div class="flood-severity">' + escapeHtml(s.source) + ' · ' + escapeHtml(s.severity || "Current") + '</div>';

        var distHtml = (typeof s.distanceMiles === "number")
          ? '<span class="card-distance">📏 About ' + s.distanceMiles.toFixed(1) + ' mi away</span>'
          : '';
        html += '<div class="card-location">📍 ' + escapeHtml(s.location) + distHtml + '</div>';
        var articleLink = s.url ? '<a href="' + safeUrl(s.url) + '" target="_blank" rel="noopener">Read →</a>' : '';
        html += '<div class="card-meta"><span>' + timeAgo(s.date) + '</span><span>' + escapeHtml(s.source) + '</span>' + articleLink + '</div>';
        html += '</div>';
      }
      feed.innerHTML = html;

      feed.querySelectorAll(".card").forEach(function(card) {
        card.addEventListener("click", function(e) {
          if (e.target.tagName === "A") return;
          if (currentFilter === "Flood") selectFloodReport(this.getAttribute("data-id"));
          else selectSighting(this.getAttribute("data-id"));
        });
      });
    }

    function findFloodById(id) {
      var sid = String(id);
      return allFloodReports.find(function(report) { return String(report.id) === sid; });
    }

    function selectFloodReport(id) {
      if (activePopup) { activePopup.remove(); activePopup = null; }
      selectedId = selectedId != null && String(selectedId) === String(id) ? null : id;
      updateFeed();
      if (!selectedId || !mapLoaded) return;
      var report = findFloodById(selectedId);
      if (report && Number.isFinite(report.lat) && Number.isFinite(report.lon)) {
        map.flyTo({ center: [report.lon, report.lat], zoom: report.geometry && report.geometry.type === "Point" ? 5 : 7, duration: 1000 });
      }
    }

    function selectSighting(id) {
      if (currentFilter === "Flood") { selectFloodReport(id); return; }
      if (activePopup) { activePopup.remove(); activePopup = null; }
      selectedId = selectedId != null && String(selectedId) === String(id) ? null : id;
      updateFeed();
      if (selectedId && mapLoaded) {
        var s = findSightingById(selectedId);
        if (s) {
          map.flyTo({ center: [s.lon, s.lat], zoom: 8, duration: 1200 });
          var speciesHtml = s.species && s.species !== "Unknown"
            ? '<span style="display:inline-flex;align-items:center;gap:3px;font-size:10px;color:#0d9488;background:rgba(13,148,136,0.1);padding:2px 7px;border-radius:99px;margin:2px 0;">' + escapeHtml(s.species) + '</span>'
            : '';
          activePopup = new mapboxgl.Popup({ offset: 12, closeButton: false, maxWidth: "260px" })
            .setLngLat([s.lon, s.lat])
            .setHTML('<div style="font-family:system-ui;padding:4px 0;"><p style="margin:0 0 4px;font-weight:600;font-size:13px;color:#1a1a2e;">' + escapeHtml(s.title.substring(0, 80)) + '</p>' + speciesHtml + '<p style="margin:4px 0;font-size:11px;color:#555;">' + escapeHtml(s.location) + ' &middot; ' + escapeHtml(s.type) + '<br>Location may be approximate.</p></div>')
            .addTo(map);
        }
      }
    }

    function render() {
      updateStats();
      updateSpeciesBar();
      updateMapData();
      updateFeed();
    }

    // ── Filter buttons ──────────────────────────
    function setFilter(filter) {
      document.querySelectorAll(".filter-btn").forEach(function(b) { b.classList.remove("active"); });
      var match = document.querySelector('.filter-btn[data-filter="' + filter + '"]');
      if (match) match.classList.add("active");
      if (currentFilter !== filter && activePopup) {
        activePopup.remove();
        activePopup = null;
      }
      if (currentFilter !== filter) selectedId = null;
      currentFilter = filter;
      document.querySelectorAll("[data-report-mode]").forEach(function(button) {
        button.setAttribute("aria-pressed", String((filter === "Flood") === (button.getAttribute("data-report-mode") === "Flood")));
      });
      document.getElementById("sidebar").classList.toggle("flood-view", filter === "Flood");
      var totalStat = document.querySelector(".stat-total");
      totalStat.setAttribute("data-filter", filter === "Flood" ? "Flood" : "All");
      totalStat.setAttribute("aria-label", filter === "Flood" ? "Show flood reports" : "Show all sightings");
      totalStat.querySelector(".stat-icon").textContent = filter === "Flood" ? "🌊" : "🦈";
      totalStat.querySelector(".stat-label").textContent = filter === "Flood" ? "Flood reports" : "Total";
      currentSpecies = "All";
      if (filter === "Flood" && !floodUpdatedAt && !floodLoadFailed) fetchFloodReports();
      updateRefreshButton();
      updateLastRefreshed();
      render();
    }

    document.querySelectorAll(".filter-btn").forEach(function(btn) {
      btn.addEventListener("click", function() {
        setFilter(this.getAttribute("data-filter"));
      });
    });
    document.querySelectorAll("[data-report-mode]").forEach(function(button) {
      button.addEventListener("click", function() { setFilter(this.getAttribute("data-report-mode")); });
    });

    document.querySelectorAll(".stat[data-filter]").forEach(function(stat) {
      stat.addEventListener("click", function() {
        setFilter(this.getAttribute("data-filter"));
      });
    });

    document.querySelectorAll(".time-pill").forEach(function(pill) {
      pill.addEventListener("click", function() {
        document.querySelectorAll(".time-pill").forEach(function(p) { p.classList.remove("active"); });
        this.classList.add("active");
        currentTimeRange = this.getAttribute("data-range");
        fetchSightings(false);
      });
    });

    // ── Confidence badge helper ─────────────────
    var CONFIDENCE_CLASS = {
      "Verified": "health-verified",
      "Likely": "health-likely",
      "Unconfirmed": "health-unconfirmed",
      "Low confidence": "health-low"
    };
    function healthBadge(label, score) {
      if (!label) return "";
      var cls = CONFIDENCE_CLASS[label] || "health-unconfirmed";
      var title = score != null ? "Credibility: " + score + "/100" : label;
      return '<span class="health-dot ' + cls + '" title="' + title + '">' + label + '</span>';
    }

    var lastFetchedAt = null;
    // Unified location state. Shape: { kind:"spot"|"freeform", name, lat, lon, radiusMiles, slug? }
    var activeLocation = null;
    var searchedLocationMarker = null;
    var geocodeCache = {};
    var MAPBOX_GEOCODE_URL = "https://api.mapbox.com/geocoding/v5/mapbox.places/";

    // ── Surf spots — loaded from /api/surf-spots on page init ──
    // Source of truth lives in lib/surf-spots.ts; the API endpoint serves
    // the slim search-relevant subset. Falls back to empty list on failure,
    // in which case the picker degrades to freeform geocoded search only.
    var SURF_SPOTS = [];
    fetch("/api/surf-spots")
      .then(function(r) { return r.ok ? r.json() : { spots: [] }; })
      .then(function(data) { SURF_SPOTS = (data && data.spots) || []; })
      .catch(function() { /* picker still works via freeform search */ });

    function searchSurfSpots(query) {
      var q = (query || "").trim().toLowerCase();
      if (!q) return SURF_SPOTS;
      return SURF_SPOTS.filter(function(spot) {
        var hay = [spot.name, spot.region, spot.country, spot.slug]
          .concat(spot.aliases || []).join(" ").toLowerCase();
        return hay.indexOf(q) !== -1;
      });
    }

    // ── Mapbox geocoding (browser-side, cached in-memory) ──
    function geocodeViaMapbox(query) {
      var q = (query || "").trim();
      if (!q) return Promise.resolve(null);
      if (TOKEN.indexOf("pk.") !== 0) return Promise.reject(new Error("Place search is unavailable"));
      var key = q.toLowerCase();
      if (geocodeCache[key]) return Promise.resolve(geocodeCache[key]);
      var url = MAPBOX_GEOCODE_URL + encodeURIComponent(q) + ".json?limit=1&access_token=" + TOKEN;
      return fetch(url)
        .then(function(r) {
          if (!r.ok) throw new Error("Geocoder returned " + r.status);
          return r.json();
        })
        .then(function(data) {
          var feat = (data.features || [])[0];
          if (!feat || !feat.center) return null;
          var result = { name: feat.place_name || q, lat: feat.center[1], lon: feat.center[0] };
          geocodeCache[key] = result;
          return result;
        });
    }

    function placeSearchMarker(lat, lon) {
      if (!map) return;
      if (searchedLocationMarker) searchedLocationMarker.remove();
      var el = document.createElement("div");
      el.style.cssText = "width:18px;height:18px;border-radius:50%;background:#5eead4;border:3px solid rgba(2,6,23,0.95);box-shadow:0 0 0 2px rgba(94,234,212,0.45),0 4px 12px rgba(0,0,0,0.4);";
      searchedLocationMarker = new mapboxgl.Marker({ element: el })
        .setLngLat([lon, lat])
        .addTo(map);
    }
    function clearSearchMarker() {
      if (searchedLocationMarker) { searchedLocationMarker.remove(); searchedLocationMarker = null; }
    }

    // ── Location picker (surf spots + free-form ZIP/city/state/country) ──
    (function() {
      var input = document.getElementById("surf-picker-input");
      var menu  = document.getElementById("surf-picker-menu");
      var clearBtn = document.getElementById("surf-picker-clear");
      var picker = document.getElementById("surf-picker");
      var toggle = document.getElementById("surf-picker-toggle");
      var toggleLabel = document.getElementById("surf-picker-toggle-label");
      var panel = document.getElementById("surf-picker-panel");
      var radiusWrap = document.getElementById("surf-picker-radius-wrap");
      var radiusInput = document.getElementById("surf-picker-radius");
      var radiusLabel = document.getElementById("surf-picker-radius-label");
      var errorEl = document.getElementById("surf-picker-error");
      if (!input || !menu || !toggle || !panel) return;

      function setExpanded(expanded) {
        panel.hidden = !expanded;
        toggle.setAttribute("aria-expanded", expanded ? "true" : "false");
        if (expanded) {
          renderMenu(input.value);
          menu.classList.remove("hidden");
          requestAnimationFrame(function() { input.focus(); });
        } else {
          closeMenu();
        }
      }

      function showError(msg) {
        if (!errorEl) return;
        errorEl.textContent = msg;
        errorEl.classList.remove("hidden");
        clearTimeout(showError._t);
        showError._t = setTimeout(function() { errorEl.classList.add("hidden"); }, 3500);
      }

      function setRadiusUI(miles) {
        radiusInput.value = miles;
        radiusLabel.textContent = miles + " mi";
      }

      function showRadiusSlider(show) {
        radiusWrap.classList.toggle("active", !!show);
      }

      function renderMenu(query) {
        var results = searchSurfSpots(query).slice(0, 12);
        if (!results.length) {
          menu.innerHTML = '<div class="surf-picker-empty">No surf spots — press Enter to search any place</div>';
          return;
        }
        menu.innerHTML = results.map(function(spot) {
          return '<button type="button" class="surf-picker-option" role="option" data-slug="' + spot.slug + '">' +
            '<span class="surf-picker-name">' + escapeHtml(spot.name) + '</span>' +
            '<span class="surf-picker-meta">' + escapeHtml(spot.region) + ', ' + escapeHtml(spot.country) + '</span>' +
            '</button>';
        }).join("");
      }

      function openMenu() { renderMenu(input.value); menu.classList.remove("hidden"); }
      function closeMenu() { menu.classList.add("hidden"); }

      toggle.addEventListener("click", function() { setExpanded(panel.hidden); });
      input.addEventListener("focus", openMenu);
      input.addEventListener("input", openMenu);

      menu.addEventListener("click", function(e) {
        var btn = e.target.closest(".surf-picker-option");
        if (!btn) return;
        e.preventDefault();
        var slug = btn.getAttribute("data-slug");
        var spot = SURF_SPOTS.find(function(s) { return s.slug === slug; });
        if (spot) selectSurfSpot(spot);
      });

      document.addEventListener("pointerdown", function(e) {
        if (!picker.contains(e.target)) setExpanded(false);
      });
      input.addEventListener("keydown", function(e) {
        if (e.key === "Escape") { setExpanded(false); toggle.focus(); return; }
        if (e.key === "Enter") {
          e.preventDefault();
          var q = input.value.trim();
          if (!q) return;
          closeMenu();
          input.blur();
          submitFreeform(q);
        }
      });

      radiusInput.addEventListener("input", function() {
        radiusLabel.textContent = radiusInput.value + " mi";
      });
      radiusInput.addEventListener("change", function() {
        if (!activeLocation) return;
        activeLocation.radiusMiles = parseInt(radiusInput.value, 10) || 100;
        fetchSightings(false);
      });

      clearBtn.addEventListener("click", clearLocation);

      window.__selectSurfSpot = selectSurfSpot;
      window.__clearSurfSpot  = clearLocation;

      function selectSurfSpot(spot) {
        activeLocation = {
          kind: "spot",
          slug: spot.slug,
          name: spot.name,
          lat: spot.lat,
          lon: spot.lon,
          radiusMiles: 100,
        };
        input.value = spot.name;
        toggleLabel.textContent = spot.name;
        clearBtn.hidden = false;
        setExpanded(false);
        setRadiusUI(activeLocation.radiusMiles);
        showRadiusSlider(true);

        try { map.flyTo({ center: [spot.lon, spot.lat], zoom: 10, duration: 1200 }); }
        catch (err) { /* map not ready */ }
        placeSearchMarker(spot.lat, spot.lon);

        if (window.__snapBottomSheet) window.__snapBottomSheet("half");
        fetchSightings(false);
      }

      function submitFreeform(query) {
        input.placeholder = "Searching...";
        geocodeViaMapbox(query)
          .then(function(result) {
            input.placeholder = "ZIP, city, state, or beach";
            if (!result) {
              showError("Couldn't find that location. Try a ZIP, city/state, or country.");
              return;
            }
            activeLocation = {
              kind: "freeform",
              name: result.name,
              lat: result.lat,
              lon: result.lon,
              radiusMiles: 100,
            };
            input.value = result.name.split(",").slice(0, 2).join(",");
            toggleLabel.textContent = input.value;
            clearBtn.hidden = false;
            setRadiusUI(activeLocation.radiusMiles);
            showRadiusSlider(true);
            setExpanded(false);

            try { map.flyTo({ center: [result.lon, result.lat], zoom: 8, duration: 1200 }); }
            catch (err) { /* map not ready */ }
            placeSearchMarker(result.lat, result.lon);

            if (window.__snapBottomSheet) window.__snapBottomSheet("half");
            fetchSightings(false);
          })
          .catch(function(err) {
            input.placeholder = "ZIP, city, state, or beach";
            if (window.__SHARKBAIT_DEBUG__) console.error("Geocode failed:", err);
            showError("Search failed. Please try again.");
          });
      }

      function clearLocation() {
        activeLocation = null;
        input.value = "";
        toggleLabel.textContent = "Going surfing?";
        clearBtn.hidden = true;
        setExpanded(false);
        showRadiusSlider(false);
        clearSearchMarker();
        updateNearbyBanner(null);
        fetchSightings(false);
      }
    })();

    function updateNearbyBanner(loc) {
      var banner = document.getElementById("nearby-banner");
      if (!banner) return;
      if (!loc) { banner.classList.remove("active"); return; }

      var titleEl = document.getElementById("nearby-title");
      var subEl = document.getElementById("nearby-sub");
      var closestEl = document.getElementById("nearby-closest");

      titleEl.textContent = loc.name;
      var withDist = (allSightings || []).filter(function(s) { return typeof s.distanceMiles === "number"; });
      subEl.textContent = withDist.length + " nearby report" + (withDist.length === 1 ? "" : "s") + " within " + loc.radiusMiles + " mi";

      if (withDist.length) {
        var closest = withDist.slice().sort(function(a, b) { return a.distanceMiles - b.distanceMiles; })[0];
        var miles = closest.distanceMiles.toFixed(1);
        var label = closest.species && closest.species !== "Unknown" ? closest.species : closest.type;
        closestEl.textContent = "Closest: " + label + ", " + miles + " mi away";
      } else {
        closestEl.textContent = "No reports within range right now.";
      }
      banner.classList.add("active");
    }

    // ── Fetch ────────────────────────────────────
    function fetchSightings(silent) {
      if (silent && sightingsRequest) return;
      if (sightingsRequest) sightingsRequest.abort();
      var request = new AbortController();
      sightingsRequest = request;
      var timer = setTimeout(function() { request.abort(); }, 20000);
      var status = document.getElementById("sightings-status");
      updateRefreshButton();
      if (!silent && currentFilter !== "Flood") {
        document.getElementById("loading").classList.remove("hidden");
      }

      var requestedDays = currentTimeRange === "all" ? 365 : 30;
      var locationQuery = "";
      var loc = activeLocation;
      if (loc) {
        if (loc.kind === "spot" && loc.slug) {
          locationQuery = "&spot=" + encodeURIComponent(loc.slug);
        } else {
          locationQuery = "&lat=" + encodeURIComponent(loc.lat) + "&lon=" + encodeURIComponent(loc.lon);
        }
        locationQuery += "&radius=" + encodeURIComponent(loc.radiusMiles);
      }
      if (locationQuery !== sightingsLocationQuery) {
        sightingsLocationQuery = locationQuery;
        allSightings = [];
        lastFetchedAt = null;
        sightingsLoadFailed = false;
        status.hidden = true;
        updateNearbyBanner(null);
        if (currentFilter !== "Flood") render();
      }

      fetch("/api/sightings?days=" + requestedDays + locationQuery, { signal: request.signal })
        .then(function(r) {
          if (!r.ok) throw new Error("Server returned " + r.status);
          return r.json();
        })
        .then(function(data) {
          if (sightingsRequest !== request) return;
          var rows = Array.isArray(data) ? data : data.sightings;
          if (!Array.isArray(rows)) throw new Error("Invalid sightings response");
          lastFetchedAt = data.fetchedAt || new Date().toISOString();
          allSightings = rows;
          sightingsLoadFailed = false;
          updateNearbyBanner(loc || null);
        })
        .catch(function(err) {
          if (sightingsRequest !== request) return;
          if (window.__SHARKBAIT_DEBUG__) console.error("Fetch failed:", err);
          sightingsLoadFailed = true;
        })
        .finally(function() {
          clearTimeout(timer);
          if (sightingsRequest !== request) return;
          sightingsRequest = null;
          status.textContent = "Refresh failed. Showing previously loaded sightings.";
          status.hidden = !sightingsLoadFailed || !allSightings.length;
          document.getElementById("loading").classList.add("hidden");
          updateRefreshButton();
          updateLastRefreshed();
          if (currentFilter !== "Flood") render();
        });
    }

    function updateRefreshButton() {
      var btn = document.getElementById("refresh-btn");
      btn.disabled = currentFilter === "Flood" ? floodLoading : !!sightingsRequest;
      btn.textContent = btn.disabled ? "Loading reports…" : "🔄 Refresh reports";
    }

    function fetchFloodReports() {
      if (floodLoading) return;
      floodLoading = true;
      var request = new AbortController();
      var timer = setTimeout(function() { request.abort(); }, 12000);
      updateRefreshButton();
      if (currentFilter === "Flood") updateFeed();
      fetch("/api/floods", { signal: request.signal })
        .then(function(r) {
          if (!r.ok) throw new Error("Server returned " + r.status);
          return r.json();
        })
        .then(function(data) {
          if (!Array.isArray(data.reports) || !data.sources || !data.sources.nws || !data.sources.gdacs) {
            throw new Error("Invalid flood response");
          }
          allFloodReports = data.reports;
          floodSourceStatus = data.sources;
          floodUpdatedAt = data.updatedAt || new Date().toISOString();
          floodLoadFailed = false;
        })
        .catch(function(err) {
          if (window.__SHARKBAIT_DEBUG__) console.error("Flood report fetch failed:", err);
          floodLoadFailed = true;
        })
        .finally(function() {
          clearTimeout(timer);
          floodLoading = false;
          updateRefreshButton();
          updateLastRefreshed();
          if (currentFilter === "Flood") render();
        });
    }

    function updateLastRefreshed() {
      var el = document.getElementById("last-refreshed");
      if (!el) return;
      var updatedAt = currentFilter === "Flood" ? floodUpdatedAt : lastFetchedAt;
      if (!updatedAt) { el.textContent = ""; return; }
      var mins = Math.floor((Date.now() - new Date(updatedAt).getTime()) / 60000);
      el.textContent = mins < 1 ? "Updated just now" : "Updated " + mins + "m ago";
    }

    // Auto-refresh every 5 minutes
    setInterval(function() {
      if (currentFilter === "Flood") fetchFloodReports();
      else fetchSightings(true);
    }, 5 * 60 * 1000);
    // Tick the "updated Xm ago" label every minute
    setInterval(updateLastRefreshed, 60 * 1000);

    document.getElementById("refresh-btn").addEventListener("click", function() {
      if (currentFilter === "Flood") fetchFloodReports();
      else fetchSightings(false);
    });

    // ── Desktop: resizable sidebar ──────────────
    (function() {
      if (window.innerWidth < 768) return;
      var handle = document.getElementById("resize-handle");
      var sidebar = document.getElementById("sidebar");
      var dragging = false;
      handle.addEventListener("mousedown", function(e) {
        e.preventDefault(); dragging = true;
        handle.classList.add("active");
        document.body.classList.add("resizing");
        document.addEventListener("mousemove", onMove);
        document.addEventListener("mouseup", onEnd);
      });
      function onMove(e) {
        if (!dragging) return;
        var w = Math.max(260, Math.min(window.innerWidth - e.clientX, window.innerWidth * 0.65));
        sidebar.style.width = w + "px";
        resizeMap();
      }
      function onEnd() {
        dragging = false; handle.classList.remove("active");
        document.body.classList.remove("resizing");
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onEnd);
        resizeMap();
      }
      window.addEventListener("resize", resizeMap);
    })();

    // ── Mobile: bottom sheet ─────────────────────
    (function() {
      if (window.innerWidth >= 768) return;

      var sidebar = document.getElementById("sidebar");
      var handle  = document.getElementById("sheet-handle");
      var feed    = document.getElementById("feed");

      // Snap positions (px translate from bottom) — computed at runtime
      var PEEK_SHOW = 150;  // handle, report switch, and stats
      var state = "peek";   // "peek" | "half" | "full"
      var startY = 0, startTY = 0, isDragging = false;
      var velY = 0, lastY = 0, lastT = 0;

      function sheetH() { return sidebar.offsetHeight; }
      function winH()   { return window.innerHeight; }

      function translateFor(s) {
        var h = sheetH();
        if (s === "full") return 0;
        if (s === "half") return h - Math.round(winH() * 0.52);
        return h - PEEK_SHOW; // peek
      }

      function applyTranslate(ty, animate) {
        sidebar.classList.toggle("sheet-snap", animate);
        sidebar.classList.remove("sheet-dragging");
        sidebar.style.setProperty("--sheet-translate", ty + "px");
        sidebar.style.transform = "translateY(" + ty + "px)";
      }

      function snapTo(s, animate) {
        state = s;
        sidebar.classList.remove("sheet-peek","sheet-half","sheet-full");
        sidebar.classList.add("sheet-" + s);
        document.body.classList.remove("sheet-peek","sheet-half","sheet-full");
        document.body.classList.add("sheet-" + s);
        handle.setAttribute("aria-label", s === "full" ? "Collapse results" : "Expand results");
        applyTranslate(translateFor(s), animate);
      }

      // Init — start at peek after a brief delay so the DOM is ready
      requestAnimationFrame(function() {
        sidebar.style.transition = "none";
        snapTo("peek", false);
        requestAnimationFrame(function() { sidebar.style.transition = ""; });
      });

      // Expose for surf-spot picker so a selection can pop the sheet to half
      window.__snapBottomSheet = function(s) { snapTo(s, true); resizeMap(); };

      // Drag logic — works on both handle AND the feed (when at top of scroll)
      function startDrag(clientY) {
        isDragging = true;
        startY = clientY; startTY = translateFor(state);
        velY = 0; lastY = clientY; lastT = Date.now();
        sidebar.classList.add("sheet-dragging");
        sidebar.classList.remove("sheet-snap");
      }

      function moveDrag(clientY) {
        if (!isDragging) return;
        var now = Date.now();
        var dt = Math.max(1, now - lastT);
        velY = (clientY - lastY) / dt;
        lastY = clientY; lastT = now;

        var ty = startTY + (clientY - startY);
        var max = sheetH() - PEEK_SHOW;
        ty = Math.max(0, Math.min(ty, max));
        sidebar.style.transform = "translateY(" + ty + "px)";
      }

      function endDrag() {
        if (!isDragging) return;
        isDragging = false;
        sidebar.classList.remove("sheet-dragging");

        var curTY  = translateFor(state) + (lastY - startY);
        var h      = sheetH();
        var peekTY = h - PEEK_SHOW;
        var halfTY = h - Math.round(winH() * 0.52);
        var fullTY = 0;

        // Use velocity to bias direction
        var THRESHOLD = 0.3; // px/ms
        var next;
        if (velY > THRESHOLD) {
          // flicking down
          next = state === "full" ? "half" : "peek";
        } else if (velY < -THRESHOLD) {
          // flicking up
          next = state === "peek" ? "half" : "full";
        } else {
          // snap to nearest
          var dists = [
            { s: "peek", d: Math.abs(curTY - peekTY) },
            { s: "half", d: Math.abs(curTY - halfTY) },
            { s: "full", d: Math.abs(curTY - fullTY) },
          ];
          dists.sort(function(a,b){ return a.d - b.d; });
          next = dists[0].s;
        }
        snapTo(next, true);
        resizeMap();
      }

      // Touch on the sheet handle
      handle.addEventListener("touchstart", function(e) {
        startDrag(e.touches[0].clientY);
      }, { passive: true });

      // Also allow dragging from anywhere on the sidebar header area
      // (stats, filters) but NOT from inside the scrolling feed
      sidebar.addEventListener("touchstart", function(e) {
        if (feed.contains(e.target)) {
          // At "full" — let the feed scroll natively, don't hijack touches
          if (state === "full") return;
          // At half/peek — only let feed scroll if it's already scrolled
          if (feed.scrollTop > 2) return;
        }
        if (e.target.closest("button") || e.target.closest("a")) return;
        startDrag(e.touches[0].clientY);
      }, { passive: true });

      document.addEventListener("touchmove", function(e) {
        if (!isDragging) return;
        // Only prevent default if we're actually moving the sheet
        if (Math.abs(e.touches[0].clientY - startY) > 4) e.preventDefault();
        moveDrag(e.touches[0].clientY);
      }, { passive: false });

      document.addEventListener("touchend", function() { endDrag(); });

      // Tap the handle pill to cycle: peek → half → full → peek
      handle.addEventListener("click", function() {
        var next = state === "peek" ? "half" : state === "half" ? "full" : "peek";
        snapTo(next, true);
        resizeMap();
      });

      // When a map pin is tapped: pull sheet to half so map is visible
      window.addEventListener("sharkmap:select", function() {
        if (state === "full") { snapTo("half", true); resizeMap(); }
      });

      // Expand to half when a card is tapped from peek
      sidebar.addEventListener("click", function(e) {
        var card = e.target.closest(".card");
        if (card && state === "peek") { snapTo("half", true); resizeMap(); }
      });

      window.addEventListener("resize", function() {
        snapTo(state, false);
        resizeMap();
      });
    })();

    fetchSightings();

    // ── Hamburger drawer + Supabase auth ────────────────
    // Wrapped in DOMContentLoaded so the deferred supabase-js global is ready.
    document.addEventListener("DOMContentLoaded", function() {
      var SUPABASE_URL = "https://ixknullykihbxjlcmvog.supabase.co";
      var SUPABASE_PUBLISHABLE_KEY = "sb_publishable_aChhjIWW-XBzfK0F8UBmTA_81E6P76Q";

      var sb = typeof supabase !== "undefined" && supabase.createClient && supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
      });

      var btn         = document.getElementById("menu-btn");
      var drawer      = document.getElementById("drawer");
      var backdrop    = document.getElementById("drawer-backdrop");
      var backBtn     = document.getElementById("drawer-back");
      var form        = document.getElementById("auth-form");
      var submit      = document.getElementById("auth-submit");
      var tabs        = document.querySelectorAll(".drawer-tab");
      var tabList     = document.getElementById("drawer-tabs");
      var fieldUser   = document.getElementById("field-username");
      var fieldEmail  = document.getElementById("field-email");
      var inputUser   = document.getElementById("su-username");
      var inputEmail  = document.getElementById("su-email");
      var inputPwd    = document.getElementById("su-password");
      var titleEl     = document.getElementById("drawer-title");
      var subtitleEl  = document.getElementById("drawer-subtitle");
      var forgotLink  = document.getElementById("forgot-link");
      var accountBox  = document.getElementById("drawer-account");
      var accountName = document.getElementById("drawer-account-name");
      var accountMail = document.getElementById("drawer-account-email");
      var signoutBtn  = document.getElementById("drawer-signout");
      var toastEl     = document.getElementById("toast");
      var toastTimer  = null;
      var mode        = "signin";

      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function() { toastEl.classList.remove("show"); }, 4000);
      }

      function openDrawer()  {
        drawer.classList.add("open"); backdrop.classList.add("open");
        btn.classList.add("open");
        btn.setAttribute("aria-expanded", "true");
        drawer.setAttribute("aria-hidden", "false");
      }
      function closeDrawer() {
        drawer.classList.remove("open"); backdrop.classList.remove("open");
        btn.classList.remove("open");
        btn.setAttribute("aria-expanded", "false");
        drawer.setAttribute("aria-hidden", "true");
      }

      function setMode(next) {
        mode = next;
        form.style.display = "";
        accountBox.hidden = true;
        tabList.hidden = next === "recovery";
        fieldEmail.hidden = next === "recovery";
        inputEmail.required = next !== "recovery";
        inputEmail.disabled = next === "recovery";
        tabs.forEach(function(t) {
          t.classList.toggle("active", t.getAttribute("data-mode") === next);
        });
        if (next === "signup") {
          titleEl.textContent = "Create your account";
          subtitleEl.textContent = "Choose a username and confirm your email to sign in.";
          fieldUser.hidden = false;
          inputUser.required = true;
          inputPwd.setAttribute("autocomplete", "new-password");
          submit.textContent = "Create account";
          forgotLink.style.display = "none";
        } else if (next === "recovery") {
          titleEl.textContent = "Reset your password";
          subtitleEl.textContent = "Enter a new password with at least 8 characters.";
          fieldUser.hidden = true;
          inputUser.required = false;
          inputPwd.setAttribute("autocomplete", "new-password");
          submit.textContent = "Update password";
          forgotLink.style.display = "none";
        } else {
          titleEl.textContent = "Sign in to Sharkbait";
          subtitleEl.textContent = "Welcome back.";
          fieldUser.hidden = true;
          inputUser.required = false;
          inputPwd.setAttribute("autocomplete", "current-password");
          submit.textContent = "Sign in";
          forgotLink.style.display = "";
        }
      }

      function renderSession(session) {
        if (session && session.user) {
          var u = session.user;
          var uname = (u.user_metadata && u.user_metadata.username) || (u.email || "").split("@")[0];
          accountName.textContent = uname;
          accountMail.textContent = u.email || "";
          accountBox.hidden = false;
          form.style.display = "none";
          tabList.hidden = true;
          titleEl.textContent = "Your account";
          subtitleEl.textContent = "You're signed in.";
        } else {
          accountBox.hidden = true;
          form.style.display = "";
          setMode(mode === "recovery" ? "signin" : mode);
        }
      }

      // Tab switching
      tabs.forEach(function(t) {
        t.addEventListener("click", function() { setMode(t.getAttribute("data-mode")); });
      });

      // Open / close drawer
      btn.addEventListener("click", function() {
        if (drawer.classList.contains("open")) closeDrawer(); else openDrawer();
      });
      backdrop.addEventListener("click", closeDrawer);
      backBtn.addEventListener("click", closeDrawer);
      document.addEventListener("keydown", function(e) {
        if (e.key === "Escape" && drawer.classList.contains("open")) closeDrawer();
      });

      if (!sb) {
        titleEl.textContent = "Sign-in is temporarily unavailable";
        subtitleEl.textContent = "You can still browse reports without an account.";
        tabList.hidden = true;
        form.hidden = true;
        return;
      }

      // Form submit (sign in OR sign up)
      form.addEventListener("submit", async function(e) {
        e.preventDefault();
        var username = inputUser.value.trim();
        var email    = inputEmail.value.trim();
        var password = inputPwd.value;

        if (mode !== "recovery" && !/^\S+@\S+\.\S+$/.test(email)) { showToast("Enter a valid email"); return; }
        if (password.length < 8) { showToast("Password must be 8+ characters"); return; }
        if (mode === "signup" && username.length < 2) { showToast("Pick a username (2+ chars)"); return; }

        submit.disabled = true;
        var action = submit.textContent;
        submit.textContent = "Working…";

        try {
          if (mode === "recovery") {
            var changed = await sb.auth.updateUser({ password: password });
            if (changed.error) throw changed.error;
            form.reset();
            mode = "signin";
            renderSession(changed.data.user ? { user: changed.data.user } : null);
            showToast("Password updated.");
          } else if (mode === "signup") {
            var resUp = await sb.auth.signUp({
              email: email,
              password: password,
              options: { data: { username: username } },
            });
            if (resUp.error) throw resUp.error;
            if (resUp.data && resUp.data.user && !resUp.data.session) {
              showToast("Check your email to confirm your account.");
            } else {
              showToast("Welcome aboard, " + username + "!");
            }
            form.reset();
          } else {
            var resIn = await sb.auth.signInWithPassword({ email: email, password: password });
            if (resIn.error) throw resIn.error;
            showToast("Signed in.");
            form.reset();
          }
        } catch (err) {
          showToast(err && err.message ? err.message : "Something went wrong");
        } finally {
          submit.disabled = false;
          if (submit.textContent === "Working…") submit.textContent = action;
        }
      });

      // Forgot password
      forgotLink.addEventListener("click", async function() {
        var email = inputEmail.value.trim();
        if (!/^\S+@\S+\.\S+$/.test(email)) {
          showToast("Enter your email above first");
          return;
        }
        try {
          var res = await sb.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin,
          });
          if (res.error) throw res.error;
          showToast("Password reset link sent to " + email);
        } catch (err) {
          showToast(err && err.message ? err.message : "Could not send reset email");
        }
      });

      // Sign out
      signoutBtn.addEventListener("click", async function() {
        try {
          var result = await sb.auth.signOut();
          if (result.error) throw result.error;
          showToast("Signed out");
        } catch (err) {
          showToast("Sign out failed");
        }
      });

      // React to auth state changes (sign in, sign out, token refresh)
      sb.auth.onAuthStateChange(function(event, session) {
        if (event === "PASSWORD_RECOVERY" && session) {
          setMode("recovery");
          openDrawer();
        } else if (mode !== "recovery" || !session) {
          renderSession(session);
        }
      });

      // Hydrate initial state
      sb.auth.getSession().then(function(res) {
        if (mode !== "recovery") renderSession(res.data && res.data.session);
      });
      setMode("signin");
    });

  </script>
</body>
